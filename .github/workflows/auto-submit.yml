name: Auto Comment

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分(UTC)
  workflow_dispatch:

jobs:
  comment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install chromium

      - run: python main.py