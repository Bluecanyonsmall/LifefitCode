name: Auto Comment

on:
  workflow_dispatch:   # 手動実行
  schedule:
    - cron: '0 * * * *'   # 1時間ごと（UTC）

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run Python
        run: python main.py